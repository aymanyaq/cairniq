[pytest]
norecursedirs = tests/legacy .* build dist CVS _darcs {arch} *.egg
testpaths = tests
python_files = test_*.py
pythonpath = .

markers =
    allow_network: test needs a real socket (the transport is the subject). Excluded from the default lane.
    slow: test takes >1s even offline. Excluded from `make test-fast`.
    real_trade_journal_path: test asserts on where tools.trade_journal._journal_file
        resolves, so the autouse isolate_trade_journal redirect would hide exactly
        what it checks. Keeps the production resolver; the fixture blocks the
        journal's writers in exchange, so marked tests still cannot write user_data.
        Path-resolution assertions only.
