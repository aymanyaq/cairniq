# Pre-commit hooks for CairnIQ — local, offline secret-leak prevention.
# This is the "belt" to GitHub push protection's "suspenders": it blocks
# secrets at COMMIT time on your machine, before they ever enter git history.
#
# One-time setup:
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# Run manually against everything:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Flags any committed private key (PEM/OpenSSH/etc.).
      - id: detect-private-key
      # Stops large blobs (often accidental data/credential dumps) sneaking in.
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  # Mirror the CI "Code Quality" job locally so lint failures (e.g. unsorted
  # imports / I001) are caught and auto-fixed at commit time, not after push.
  # CI runs `ruff check .`; --fix auto-corrects fixable issues then fails the
  # commit so you re-stage. Uses the repo's ruff.toml. Keep rev in sync with the
  # ruff version used in CI / locally — bump them together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix"]
